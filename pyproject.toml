[project]
name = "ha-dots-energy"
version = "0.1.0"
description = "Home Assistant integration for Dots Energy invoices"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
