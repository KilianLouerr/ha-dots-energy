# Melding op je telefoon bij een nieuwe Dots-factuur.
# Vervang notify.mobile_app_jouw_telefoon door de notify-actie van je eigen telefoon.
alias: "Dots: nieuwe factuur"
description: Stuurt een melding met het bedrag en het verschil met de vorige factuur.
mode: queued
triggers:
  - trigger: event.received
    target:
      entity_id: event.dots_energy_nieuwe_factuur
    options:
      event_type:
        - nieuwe_factuur
actions:
  - variables:
      periode: "{{ state_attr('event.dots_energy_nieuwe_factuur', 'period') }}"
      bedrag: "{{ state_attr('event.dots_energy_nieuwe_factuur', 'amount') }}"
      verschil: "{{ state_attr('event.dots_energy_nieuwe_factuur', 'difference') }}"
  - action: notify.mobile_app_jouw_telefoon
    data:
      title: Nieuwe Dots-factuur
      message: >-
        {% set maanden = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'] %}
        {%- set p = (periode or '0000-01').split('-') -%}
        € {{ '%.2f' | format(bedrag | float(0)) | replace('.', ',') }} voor {{ maanden[p[1] | int - 1] }} {{ p[0] }}
        {%- if verschil is not none %} ({{ '+' if verschil | float >= 0 else '−' }}€ {{ '%.2f' | format(verschil | float | abs) | replace('.', ',') }} t.o.v. vorige factuur){% endif %}
      data:
        clickAction: /dots-facturen/facturen
        tag: dots-nieuwe-factuur
