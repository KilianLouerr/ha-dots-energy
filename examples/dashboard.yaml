        c: '[[[ const so = entity.attributes || {}; const ex = states[''sensor.dots_energy_verwachte_factuur'']; const N = so.dagen_in_maand || 30; const ds = so.dagreeks || []; const pv = so.dagreeks_vorige_maand || []; const E = Number(ex?.state); const hasE = !!ex && !isNaN(E); const M = [''jan'',''feb'',''mrt'',''apr'',''mei'',''jun'',''jul'',''aug'',''sep'',''okt'',''nov'',''dec'']; const lf = states[''sensor.dots_energy_laatste_factuur'']; const F = Number(lf?.state); const hasF = !!lf && !isNaN(F); const fp = (lf?.attributes?.periode_start || '''').split(''-''); const fl = fp.length > 1 ? M[+fp[1] - 1] : ''''; const eur = v => { const n = Number(v); return (n < 0 ? ''€ −'' : ''€ '') + Math.abs(n).toLocaleString(''nl-BE'', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }; if (!ds.length) return `<div class=''title''>Verloop deze maand</div><div class=''empty''>Nog geen voorspelling</div>`; const vals = [0, ...ds.map(p => p.totaal), ...pv.map(p => p.totaal)]; if (hasE) vals.push(E);
          if (hasF) vals.push(F); let hi = Math.max(...vals), lo = Math.min(...vals); const step = hi - lo > 240 ? 50 : 20; hi = Math.max(step, Math.ceil(hi / step) * step); lo = Math.floor(lo / step) * step; const span = hi - lo; const X = d => d / N * 100; const Y = v => 100 - (v - lo) / span * 100; const B = v => (v - lo) / span * 100; const pts = a => a.map(p => `${X(p[0])},${Y(p[1])}`).join('' ''); const cur = [[0, 0], ...ds.map(p => [p.dag, p.totaal])]; const last = cur[cur.length - 1]; const prev = pv.length ? [[0, 0], ...pv.map(p => [Math.min(p.dag, N), p.totaal])] : []; const ticks = []; for (let t = lo; t <= hi + 0.001; t += step) ticks.push(t); const xt = [1, 5, 10, 15, 20, 25].filter(d => N - d >= 3).concat([N]); const pm = (so.vorige_maand || '''').split(''-''); const pl = pm.length > 1 ? M[+pm[1] - 1] : ''''; const pe = pv.length ? pv[pv.length - 1] : null; const leg = `<div class=''legend''><span><i class=''l cur''></i>deze maand (geschat)</span>` + (hasE ? `<span><i class=''l
          proj''></i>verwacht (geschat)</span>` : '''') + (pv.length ? `<span><i class=''l prev''></i>${pl} nagerekend (geschat)</span>` : '''') + (hasF ? `<span><i class=''l inv''></i>echte factuur ${fl}</span>` : '''') + `</div>`; let o = `<div class=''title''>Verloop deze maand</div>` + leg + `<div class=''plot''><div class=''yax''>` + ticks.map(t => `<span style=''bottom:${B(t)}%''>€ ${t}</span>`).join('''') + `</div><div class=''area''>` + ticks.map(t => `<div class=''grid ${t === 0 ? ''zero'' : ''''}'' style=''bottom:${B(t)}%''></div>`).join('''') + `<svg viewBox=''0 0 100 100'' preserveAspectRatio=''none''>`; if (hasF) o += `<line class=''inv'' x1=''${X(N * 0.9)}'' x2=''100'' y1=''${Y(F)}'' y2=''${Y(F)}''/>`; if (prev.length) o += `<polyline class=''prev'' points=''${pts(prev)}''/>`; if (hasE) o += `<polyline class=''proj'' points=''${pts([last, [N, E]])}''/>`; o += `<polyline class=''cur'' points=''${pts(cur)}''/></svg>`; o += `<div class=''dot'' style=''left:${X(last[0])}%;top:${Y(last[1])}%''></div>`;
          o += `<div class=''lbl'' style=''left:${X(last[0])}%;top:${Y(last[1])}%''>vandaag ${eur(last[1])}</div>`; if (hasE) o += `<div class=''lbl end'' style=''left:100%;top:${Y(E)}%''>≈ ${eur(E)}</div>`; if (pe) o += `<div class=''lbl prevl'' style=''left:${X(Math.min(pe.dag, N))}%;top:${Y(pe.totaal)}%''>${pl} nagerekend ${eur(pe.totaal)}</div>`; if (hasF) o += `<div class=''lbl invl'' style=''left:${X(N * 0.9)}%;top:${Y(F)}%''>echte factuur ${fl} ${eur(F)}</div>`; o += `</div></div><div class=''xax''>` + xt.map(d => `<span style=''left:${X(d - 0.5)}%''>${d}</span>`).join('''') + `</div>`; return o; ]]]'
      styles:
        card:
        - padding: 16px 18px
        grid:
        - grid-template-areas: '"c"'
        - grid-template-columns: 1fr
        custom_fields:
          c:
          - justify-self: stretch
          - text-align: left
